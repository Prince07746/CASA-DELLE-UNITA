  const daysHeader = document.getElementById("days-header");

const people1 = ["Melissa", "Jack", "Alpha", "Johnathan", "Mawuwa", "Prince"];
const people2 = ["Jack", "Alpha", "Johnathan", "Mawuwa", "Prince", "Melissa"];
const people3 = ["Alpha", "Johnathan", "Mawuwa", "Prince", "Melissa", "Jack"];
const people4 = ["Johnathan", "Mawuwa", "Prince", "Melissa", "Jack", "Alpha"];







  const today = new Date();
  const dayOfWeek = today.getDay(); // 0 (Sun) to 6 (Sat)
  const diffToMonday = (dayOfWeek + 6) % 7; // how many days since Monday

  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - diffToMonday);

  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const fullMonths = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
  ];

  let weekRangeText = "";



  for (let i = 0; i < 7; i++) {
    const currentDate = new Date(weekStart);
    currentDate.setDate(weekStart.getDate() + i);
    const isToday = currentDate.toDateString() === new Date().toDateString();

    const th = document.createElement("th");
    th.innerHTML = `${days[i]}<br>${currentDate.getDate()}`;
    if (isToday) th.classList.add("today");
    daysHeader.appendChild(th);


    
    var people = [people1,people2,people3,people4];
    var peopleCleaning = [people2,people3,people4,people1];


    var xWeek = getWeekOfMonth() - 1;
    
  // Fill cucinare
    const tdMember = document.createElement("td");
    tdMember.textContent = people[xWeek][i % people[xWeek].length];
    if (isToday) tdMember.classList.add("todayCucinare");
    membersRow.appendChild(tdMember);



      // Fill pulire
  const tdClean = document.createElement("td");
  tdClean.textContent = peopleCleaning[xWeek][i % peopleCleaning[xWeek].length]; // offset for variety
  if (isToday) tdClean.classList.add("todayPulire");
  cleaningRow.appendChild(tdClean);



    // Capture week start & end for title don't worry guys it will be fixed later
    if (i === 0) {
      weekRangeText += `${days[i]} ${currentDate.getDate()} ${fullMonths[currentDate.getMonth()]}`;
    }
    if (i === 6) {
      weekRangeText += ` - ${days[i]} ${currentDate.getDate()} ${fullMonths[currentDate.getMonth()]}`;
    }
  }
  document.getElementById("week-range").textContent = weekRangeText;










  function getWeekOfMonth(date = new Date()) {
    const startOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
    const startDay = startOfMonth.getDay(); // 0 (Sun) to 6 (Sat)
    const dayOfMonth = date.getDate();
  
    // Adjusting the startDay: if Sunday is the first day of the week, keep as is.
    const adjustedDate = dayOfMonth + startDay;
    return Math.ceil(adjustedDate / 7);
  }



  document.getElementById("week-number").textContent = `Week ${getWeekOfMonth()}`;

document.addEventListener("DOMContentLoaded", () => {
    const foodStockBody = document.getElementById("food-stock-body");
  
    // Clear existing data in the table body
    foodStockBody.innerHTML = "";
  
    const getQuantity = (qty) => {
      const match = qty.match(/\d+/);
      return match ? parseInt(match[0]) : 1;
    };
  
    const normalizeToMonth = (item) => {
      const quantity = getQuantity(item.quantity);
      const price = parseFloat(item.price);
      const times = parseInt(item.times);
      if (isNaN(price) || isNaN(times)) return 0;
  
      let frequency = 0;
      const range = item.range.toLowerCase();
  
      if (range === "day") frequency = 30;
      else if (range === "week") frequency = 4;
      else if (range === "2 week") frequency = 2;
      else if (range === "4 week") frequency = 1;
      else if (range === "month") frequency = 1;
      else frequency = 0; // unknown
  
      return price * quantity * times * frequency;
    };
  
    let totalPriceMonth = 0;
    let totalWeeklySpending = 0;
  
    foodData.forEach((item) => {
      const row = foodStockBody.insertRow();
      const nameCell = row.insertCell();
      const priceCell = row.insertCell();
      const quantityCell = row.insertCell();
      const timesCell = row.insertCell();
      const rangeCell = row.insertCell();
  
      nameCell.textContent = item.name;
      priceCell.textContent = item.price;
      quantityCell.textContent = item.quantity;
      timesCell.textContent = item.times;
      rangeCell.textContent = item.range;
  
      totalPriceMonth += normalizeToMonth(item);
  
      if (item.range === "week") {
        const qty = getQuantity(item.quantity);
        const price = parseFloat(item.price);
        if (!isNaN(price)) {
          totalWeeklySpending += price * qty * parseInt(item.times);
        }
      }
    });
  
    const totalCell = document.getElementById("food-stock-total");
    totalCell.textContent = `€ ${totalPriceMonth.toFixed(2)} / month`;
  
    const totalCellWeek = document.getElementById("food-stock-total-week");
    totalCellWeek.textContent = `€ ${totalWeeklySpending.toFixed(2)} / week`;
  });
