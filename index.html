<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Casa Delle Unita</title>
  <style>
    body {
      font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS';
      background-color: #adadad3a;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      border: none;
      
    }
    #week-number {
      font-size: small;
      color: rgb(61, 61, 61);
    }

    #t1{
        color: rgb(94, 196, 94);
    }
    #t2{
        color: white;
        margin-left: 8px;
        margin-right: 3px;
    }
    #t3{
        color: red; 
    }

    #table-title {
      text-align: center;
      font-size: 1em;
      margin-top: 10px;
      color: gray;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      transform: scale(0.95);
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    td {
      background-color: #fff;
    }

    .today {
      background-color: green !important;
      color: white !important;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>

<h1><span id="t1">CASA</span><span id="t2">DELLE</span> <span id="t3">UNITA</span><br> <span id="week-number"></span></h1>
<h2 id="table-title">Weekly Schedule cucinare: <span id="week-range"></span></h2>

<table>
  <thead>
    <tr id="days-header"></tr>
  </thead>
  <tbody>
    <tr id="dishes-row"></tr>
    <tr id="members-row"></tr>
  </tbody>
</table>

<script>
  const daysHeader = document.getElementById("days-header");
  const dishesRow = document.getElementById("dishes-row");
  const membersRow = document.getElementById("members-row");



const people1 = ["Melissa", "Jack", "Alpha", "Johnathan", "Mawuwa", "Prince"];
const people2 = ["Jack", "Alpha", "Johnathan", "Mawuwa", "Prince", "Melissa"];
const people3 = ["Alpha", "Johnathan", "Mawuwa", "Prince", "Melissa", "Jack"];
const people4 = ["Johnathan", "Mawuwa", "Prince", "Melissa", "Jack", "Alpha"];







  const today = new Date();
  const dayOfWeek = today.getDay(); // 0 (Sun) to 6 (Sat)
  const diffToMonday = (dayOfWeek + 6) % 7; // how many days since Monday

  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - diffToMonday);

  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const fullMonths = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
  ];

  let weekRangeText = "";



  for (let i = 0; i < 7; i++) {
    const currentDate = new Date(weekStart);
    currentDate.setDate(weekStart.getDate() + i);
    const isToday = currentDate.toDateString() === new Date().toDateString();

    const th = document.createElement("th");
    th.innerHTML = `${days[i]}<br>${currentDate.getDate()}`;
    if (isToday) th.classList.add("today");
    daysHeader.appendChild(th);


    
    var people = [people1,people2,people3,people4];


    var xWeek = getWeekOfMonth() - 1;
    
    const tdMember = document.createElement("td");
    tdMember.textContent = people[xWeek][i % people[xWeek].length];
    if (isToday) tdMember.classList.add("today");
    membersRow.appendChild(tdMember);

    // Capture week start & end for title don't worry guys it will be fixed later
    if (i === 0) {
      weekRangeText += `${days[i]} ${currentDate.getDate()} ${fullMonths[currentDate.getMonth()]}`;
    }
    if (i === 6) {
      weekRangeText += ` - ${days[i]} ${currentDate.getDate()} ${fullMonths[currentDate.getMonth()]}`;
    }
  }

  document.getElementById("week-range").textContent = weekRangeText;






  function getWeekOfMonth(date = new Date()) {
    const startOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
    const startDay = startOfMonth.getDay(); // 0 (Sun) to 6 (Sat)
    const dayOfMonth = date.getDate();
  
    // Adjusting the startDay: if Sunday is the first day of the week, keep as is.
    const adjustedDate = dayOfMonth + startDay;
    return Math.ceil(adjustedDate / 7);
  }
  document.getElementById("week-number").textContent = `Week ${getWeekOfMonth()}`;
  
  
</script>

</body>
</html>
